name: Format local port

on:
  push:
    branches:
      - work/port-customizations-v1.104.2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: true
      - name: Install Ruff
        run: python3 -m pip install ruff==0.15.3
      - name: Format changed Python modules
        run: |
          ruff format litellm/llms/anthropic/experimental_pass_through/adapters/transformation.py
          ruff format litellm/llms/openai_like/dynamic_config.py
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add litellm/llms/anthropic/experimental_pass_through/adapters/transformation.py litellm/llms/openai_like/dynamic_config.py
            git commit -m "style: format ported Python modules"
            git push origin HEAD:work/port-customizations-v1.104.2
          fi
